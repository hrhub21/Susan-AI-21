<!DOCTYPE html>
<html>
<head>
    <title>Susan AI Simple Test</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #status { padding: 20px; background: #2a2a4e; margin: 20px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Susan AI Simple Test</h1>
    <div id="status">Status: Loading...</div>
    
    <button onclick="testBasicJS()">Test Basic JS</button>
    <button onclick="testSusanAI()">Test Susan AI Class</button>
    <button onclick="testWebSocket()">Test WebSocket</button>
    <button onclick="testVoice()">Test Voice</button>
    
    <div id="output"></div>
    
    <script>
        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.style.padding = '5px';
            div.style.margin = '5px 0';
            div.style.background = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#6c757d';
            div.style.borderRadius = '3px';
            div.innerHTML = `${new Date().toLocaleTimeString()}: ${message}`;
            output.appendChild(div);
            console.log(message);
            
            // Auto-scroll
            div.scrollIntoView({ behavior: 'smooth' });
        }
        
        function testBasicJS() {
            log('Testing basic JavaScript...', 'info');
            try {
                const test = [1, 2, 3].map(x => x * 2);
                log(`Array test: [${test.join(', ')}]`, 'success');
                log('✅ Basic JavaScript works', 'success');
            } catch (error) {
                log(`❌ Basic JS error: ${error.message}`, 'error');
            }
        }
        
        function testSusanAI() {
            log('Testing Susan AI class...', 'info');
            try {
                if (typeof SusanAI !== 'undefined') {
                    log('✅ SusanAI class exists', 'success');
                    
                    if (window.susan) {
                        log('✅ Susan instance exists', 'success');
                        log(`Susan status: ${window.susan.isListening ? 'Listening' : 'Ready'}`, 'info');
                    } else {
                        log('❌ Susan instance not created', 'error');
                    }
                } else {
                    log('❌ SusanAI class not found', 'error');
                }
            } catch (error) {
                log(`❌ Susan AI test error: ${error.message}`, 'error');
            }
        }
        
        function testWebSocket() {
            log('Testing WebSocket connection...', 'info');
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}`;
                log(`Connecting to: ${wsUrl}`, 'info');
                
                const ws = new WebSocket(wsUrl);
                
                ws.onopen = () => {
                    log('✅ WebSocket connected', 'success');
                    ws.send(JSON.stringify({ type: 'test', message: 'Hello' }));
                    setTimeout(() => ws.close(), 2000);
                };
                
                ws.onmessage = (event) => {
                    log(`📨 Received: ${event.data}`, 'success');
                };
                
                ws.onerror = (error) => {
                    log(`❌ WebSocket error`, 'error');
                };
                
                ws.onclose = () => {
                    log('WebSocket closed', 'info');
                };
                
            } catch (error) {
                log(`❌ WebSocket test failed: ${error.message}`, 'error');
            }
        }
        
        function testVoice() {
            log('Testing voice capabilities...', 'info');
            
            // Speech Recognition
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                log('✅ Speech Recognition available', 'success');
            } else {
                log('❌ Speech Recognition not available', 'error');
            }
            
            // Speech Synthesis
            if ('speechSynthesis' in window) {
                log('✅ Speech Synthesis available', 'success');
                const utterance = new SpeechSynthesisUtterance('Testing voice');
                speechSynthesis.speak(utterance);
                log('🔊 Voice test spoken', 'success');
            } else {
                log('❌ Speech Synthesis not available', 'error');
            }
            
            // MediaRecorder
            if ('MediaRecorder' in window) {
                log('✅ MediaRecorder available', 'success');
            } else {
                log('❌ MediaRecorder not available', 'error');
            }
        }
        
        // Auto-run on load
        window.onload = () => {
            document.getElementById('status').innerHTML = 'Status: Ready for testing';
            log('🚀 Simple test page loaded', 'success');
            
            // Auto-test basic functionality
            setTimeout(() => {
                testBasicJS();
                testSusanAI();
            }, 500);
        };
        
        // Load Susan AI script
        const script = document.createElement('script');
        script.src = 'susan-working.js';
        script.defer = true;
        script.onload = () => {
            log('📜 susan-working.js loaded', 'success');
        };
        script.onerror = () => {
            log('❌ Failed to load susan-working.js', 'error');
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
